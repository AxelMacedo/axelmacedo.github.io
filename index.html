<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Axel Macedo — Born in Houston.">
  <title>AXEL MACEDO | Born in Houston</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--gold:#d4b56a;--gold2:#f0d88d;--cream:#fff4d9}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%}
    body{background:#09060b;color:var(--cream);font-family:Cinzel,Georgia,serif;overflow:hidden}

    .home{
      min-height:100vh;position:relative;display:grid;place-items:center;text-align:center;overflow:hidden;
      background:
        radial-gradient(circle at 50% 42%,rgba(140,45,75,.28),transparent 38%),
        radial-gradient(circle at 20% 15%,rgba(95,20,55,.55),transparent 35%),
        linear-gradient(180deg,#09050b 0%,#1d0b16 48%,#08060a 100%);
    }

    /* Atmospheric cloud texture */
    .home:before{content:"";position:absolute;inset:-20%;opacity:.7;background:
      radial-gradient(ellipse at 25% 20%,rgba(137,47,69,.6),transparent 20%),
      radial-gradient(ellipse at 50% 25%,rgba(105,39,61,.5),transparent 24%),
      radial-gradient(ellipse at 78% 18%,rgba(120,42,64,.55),transparent 20%),
      radial-gradient(ellipse at 42% 45%,rgba(70,25,48,.45),transparent 28%);
      filter:blur(35px);transform:scale(1.1)}

    /* Houston-like skyline silhouette */
    .skyline{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:1;background:linear-gradient(180deg,transparent,#080609 28%)}
    .building{position:absolute;bottom:0;background:#09070a;border-top:1px solid rgba(212,181,106,.16);box-shadow:inset 0 0 25px rgba(0,0,0,.8)}
    .building:after{content:"";position:absolute;inset:12px 7px;background:repeating-linear-gradient(180deg,rgba(240,216,141,.65) 0 2px,transparent 2px 10px);opacity:.32}
    .b1{left:2%;width:9%;height:48%}.b2{left:12%;width:7%;height:62%}.b3{left:21%;width:10%;height:40%}.b4{left:33%;width:8%;height:77%}.b5{left:42%;width:11%;height:55%}.b6{left:54%;width:8%;height:86%}.b7{left:64%;width:11%;height:48%}.b8{left:77%;width:8%;height:70%}.b9{left:87%;width:10%;height:54%}
    .tower{position:absolute;bottom:0;left:49%;width:7%;height:94%;background:#07060a;border-top:2px solid rgba(212,181,106,.2)}
    .tower:after{content:"";position:absolute;inset:14px 9px;background:repeating-linear-gradient(180deg,rgba(255,236,177,.8) 0 2px,transparent 2px 9px);opacity:.35}

    .stars{position:absolute;inset:0;z-index:0;background-image:radial-gradient(circle,rgba(255,232,170,.75) 0 1px,transparent 1.5px);background-size:170px 150px;opacity:.35}

    .content{position:relative;z-index:8;padding:30px 22px;margin-top:-3vh;text-shadow:0 5px 25px rgba(0,0,0,.75)}
    .name{font-size:clamp(.8rem,1.8vw,1.2rem);letter-spacing:.38em;color:var(--gold2);margin-bottom:28px}
    h1{font-size:clamp(2.8rem,8vw,8.2rem);line-height:1.02;letter-spacing:.065em;font-weight:700;color:var(--cream)}
    .ornament{width:min(500px,70vw);height:2px;margin:30px auto 25px;background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative}
    .ornament:after{content:"◆";position:absolute;left:50%;top:-12px;transform:translateX(-50%);font-size:15px;color:var(--gold2)}
    .born{font-size:clamp(.75rem,1.8vw,1.15rem);letter-spacing:.45em;color:#f1ddb0;text-transform:uppercase}

    /* Rocket animation */
    .rocket-flight{position:absolute;inset:0;z-index:6;pointer-events:none}
    .rocket-wrap{position:absolute;left:-120px;top:72%;width:86px;height:86px;animation:fly 12s cubic-bezier(.45,.05,.35,1) infinite}
    .rocket{width:72px;height:72px;transform:rotate(-35deg);filter:drop-shadow(0 0 12px rgba(255,184,70,.8))}
    .flame{position:absolute;left:-18px;top:48px;width:42px;height:15px;background:linear-gradient(90deg,#fff5b0,#ffad32,#e64d1b,transparent);border-radius:50%;filter:blur(2px);animation:flicker .16s infinite alternate}
    .smoke{position:absolute;left:-45px;top:52px;width:120px;height:18px;border-radius:50%;background:linear-gradient(90deg,rgba(255,210,130,.25),transparent);filter:blur(7px)}
    @keyframes fly{0%{left:-12%;top:72%;transform:rotate(0deg) scale(.7);opacity:0}8%{opacity:1}45%{left:43%;top:40%;transform:rotate(0deg) scale(.85)}75%{left:72%;top:19%;transform:rotate(0deg) scale(.72)}92%{left:103%;top:4%;transform:rotate(0deg) scale(.55);opacity:1}100%{left:112%;top:-4%;opacity:0}}
    @keyframes flicker{from{transform:scaleX(.8);opacity:.7}to{transform:scaleX(1.2);opacity:1}}

    .bottom-glow{position:absolute;left:0;right:0;bottom:0;height:18%;z-index:3;background:linear-gradient(180deg,transparent,rgba(221,88,35,.12));box-shadow:0 -20px 80px rgba(212,181,106,.05)}
    @media(max-width:700px){.rocket-wrap{width:65px;height:65px}.rocket{width:55px;height:55px}.born{letter-spacing:.25em}.skyline{height:27%}}
    @media(prefers-reduced-motion:reduce){.rocket-wrap{animation:none;left:72%;top:18%}.flame{animation:none}}
  </style>
</head>
<body>
  <main class="home">
    <div class="stars"></div>
    <div class="skyline"><div class="building b1"></div><div class="building b2"></div><div class="building b3"></div><div class="building b4"></div><div class="tower"></div><div class="building b5"></div><div class="building b6"></div><div class="building b7"></div><div class="building b8"></div><div class="building b9"></div></div>
    <div class="bottom-glow"></div>

    <div class="rocket-flight" aria-hidden="true">
      <div class="rocket-wrap">
        <div class="smoke"></div>
        <div class="flame"></div>
        <svg class="rocket" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfc3c8"/></linearGradient></defs>
          <path d="M54 7C73 19 84 35 84 54C84 67 78 77 68 87L51 70L34 53C44 43 54 29 54 7Z" fill="url(#body)" stroke="#777" stroke-width="2"/>
          <circle cx="63" cy="34" r="8" fill="#17141a" stroke="#d4b56a" stroke-width="3"/>
          <path d="M43 61L28 65L34 48Z" fill="#9da2a8" stroke="#666" stroke-width="2"/>
          <path d="M61 77L58 93L75 83Z" fill="#9da2a8" stroke="#666" stroke-width="2"/>
          <path d="M51 70L42 78L52 88L60 79Z" fill="#ffb52e"/>
        </svg>
      </div>
    </div>

    <div class="content">
      <div class="name">AXEL MACEDO</div>
      <h1>BORN IN HOUSTON</h1>
      <div class="ornament"></div>
    </div>
  </main>
</body>
</html>
