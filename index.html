<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Axel Macedo — Born in Houston.">
  <title>AXEL MACEDO | Born in Houston</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--gold:#d4b56a;--gold2:#f0d88d;--cream:#fff4d9}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%}
    body{background:#09060b;color:var(--cream);font-family:Cinzel,Georgia,serif;overflow:hidden}

    .home{
      min-height:100vh;position:relative;display:grid;place-items:center;text-align:center;overflow:hidden;
      background-image:
        linear-gradient(rgba(12,5,12,.38),rgba(7,5,9,.58)),
        url("houston-site.jpg");
      background-size:cover;
      background-position:center center;
      background-repeat:no-repeat;
    }

    .home:before{content:"";position:absolute;inset:-20%;opacity:.28;background:
      radial-gradient(ellipse at 25% 20%,rgba(137,47,69,.6),transparent 20%),
      radial-gradient(ellipse at 50% 25%,rgba(105,39,61,.5),transparent 24%),
      radial-gradient(ellipse at 78% 18%,rgba(120,42,64,.55),transparent 20%),
      radial-gradient(ellipse at 42% 45%,rgba(70,25,48,.45),transparent 28%);
      filter:blur(35px);transform:scale(1.1);z-index:1}

    .stars{position:absolute;inset:0;z-index:2;background-image:radial-gradient(circle,rgba(255,232,170,.9) 0 1px,transparent 1.5px);background-size:170px 150px;opacity:.3}

    .content{position:relative;z-index:20;padding:30px 22px;margin-top:-3vh;text-shadow:0 5px 25px rgba(0,0,0,.85)}
    .name{font-size:clamp(.8rem,1.8vw,1.2rem);letter-spacing:.38em;color:var(--gold2);margin-bottom:28px}
    h1{font-size:clamp(2.8rem,8vw,8.2rem);line-height:1.02;letter-spacing:.065em;font-weight:700;color:var(--cream)}
    .ornament{width:min(500px,70vw);height:2px;margin:30px auto 25px;background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative}
    .ornament:after{content:"◆";position:absolute;left:50%;top:-12px;transform:translateX(-50%);font-size:15px;color:var(--gold2)}
    .born{font-size:clamp(.75rem,1.8vw,1.15rem);letter-spacing:.45em;color:#f1ddb0;text-transform:uppercase}

    .rocket-flight{position:absolute;inset:0;z-index:15;pointer-events:none;overflow:hidden}
    .rocket-wrap{position:absolute;left:-120px;top:68%;width:105px;height:105px;animation:fly 9s cubic-bezier(.45,.05,.35,1) infinite}
    .rocket{width:88px;height:88px;transform:rotate(-35deg);filter:drop-shadow(0 0 16px rgba(255,184,70,1))}
    .flame{position:absolute;left:-25px;top:58px;width:58px;height:18px;background:linear-gradient(90deg,#fffbd0,#ffd45c,#ff7a18,#e63116,transparent);border-radius:50%;filter:blur(2px);animation:flicker .12s infinite alternate;z-index:-1}
    .smoke{position:absolute;left:-70px;top:62px;width:150px;height:22px;border-radius:50%;background:linear-gradient(90deg,rgba(255,225,170,.4),transparent);filter:blur(8px)}
    @keyframes fly{
      0%{left:-12%;top:72%;transform:rotate(-8deg) scale(.7);opacity:0}
      6%{opacity:1}
      28%{left:18%;top:55%;transform:rotate(-8deg) scale(.9);opacity:1}
      52%{left:46%;top:38%;transform:rotate(-8deg) scale(1);opacity:1}
      76%{left:72%;top:20%;transform:rotate(-8deg) scale(.85);opacity:1}
      94%{left:103%;top:3%;transform:rotate(-8deg) scale(.7);opacity:1}
      100%{left:115%;top:-5%;opacity:0}
    }
    @keyframes flicker{from{transform:scaleX(.75);opacity:.75}to{transform:scaleX(1.25);opacity:1}}

    .bottom-glow{position:absolute;left:0;right:0;bottom:0;height:22%;z-index:8;background:linear-gradient(180deg,transparent,rgba(221,88,35,.16));box-shadow:0 -20px 80px rgba(212,181,106,.08)}
    @media(max-width:700px){.rocket-wrap{width:78px;height:78px}.rocket{width:66px;height:66px}.born{letter-spacing:.25em}}
    @media(prefers-reduced-motion:reduce){.rocket-wrap{animation:none;left:72%;top:18%}.flame{animation:none}}
  </style>
</head>
<body>
  <main class="home">
    <div class="stars"></div>
    <div class="bottom-glow"></div>

    <div class="rocket-flight" aria-hidden="true">
      <div class="rocket-wrap">
        <div class="smoke"></div>
        <div class="flame"></div>
        <svg class="rocket" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfc3c8"/></linearGradient></defs>
          <path d="M54 7C73 19 84 35 84 54C84 67 78 77 68 87L51 70L34 53C44 43 54 29 54 7Z" fill="url(#body)" stroke="#777" stroke-width="2"/>
          <circle cx="63" cy="34" r="8" fill="#17141a" stroke="#d4b56a" stroke-width="3"/>
          <path d="M43 61L28 65L34 48Z" fill="#9da2a8" stroke="#666" stroke-width="2"/>
          <path d="M61 77L58 93L75 83Z" fill="#9da2a8" stroke="#666" stroke-width="2"/>
          <path d="M51 70L42 78L52 88L60 79Z" fill="#ffb52e"/>
        </svg>
      </div>
    </div>

    <div class="content">
      <div class="name">AXEL MACEDO</div>
      <h1>BORN IN HOUSTON</h1>
      <div class="ornament"></div>
    </div>
  </main>
</body>
</html>
