<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Axel Macedo — Born in Houston.">
  <title>AXEL MACEDO | Born in Houston</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#17110c;--gold:#b58a3a;--gold2:#d4b56a;--cream:#f5ead2;--line:rgba(181,138,58,.45)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%}
    body{background:var(--ink);color:var(--cream);font-family:Cinzel,Georgia,serif;overflow:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");z-index:10}
    .home{min-height:100vh;display:grid;place-items:center;text-align:center;position:relative;background:radial-gradient(circle at center,rgba(181,138,58,.12),transparent 42%),linear-gradient(180deg,#17110c,#21170f 55%,#17110c)}
    .home:before,.home:after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:min(760px,78%);height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
    .home:before{top:12%}.home:after{bottom:12%}
    .content{position:relative;z-index:2;padding:40px 24px}
    .name{font-size:clamp(1rem,2vw,1.35rem);letter-spacing:.3em;color:var(--gold2);margin-bottom:28px}
    h1{font-size:clamp(3rem,9vw,8.5rem);line-height:1;letter-spacing:.06em;font-weight:700;text-shadow:0 4px 20px rgba(0,0,0,.5)}
    .born{margin-top:30px;font-size:clamp(.9rem,2vw,1.15rem);letter-spacing:.35em;color:#cdbb9b;text-transform:uppercase}
  </style>
</head>
<body>
  <main class="home">
    <div class="content">
      <div class="name">AXEL MACEDO</div>
      <h1>BORN IN HOUSTON</h1>
    </div>
  </main>
</body>
</html>
